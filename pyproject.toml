[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-xau-engine"
version = "0.1.0"
description = "Evidence-first XAUUSD replay and research engine"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]
mt5 = [
  "MetaTrader5>=5.0",
]

[project.scripts]
nexus-xau = "nexus_xau.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
